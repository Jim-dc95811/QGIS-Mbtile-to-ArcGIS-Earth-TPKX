<text x="1105" y="943" class="small">Reference the grid visually; use the matching TXT values.</text>
<text x="1025" y="1045" class="body" font-weight="700">Key rule:</text>
<text x="1025" y="1080" class="body">Neighboring cells share the exact same transformed boundaries.</text>
<text x="1025" y="1115" class="body">No custom “about here” extents are needed.</text>
